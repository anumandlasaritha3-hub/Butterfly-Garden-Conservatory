<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Wing & Bloom</title>
<link rel="stylesheet" href="site-shared.css">
<link rel="stylesheet" href="404.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header class="site-header">
    <div class="header-toggles">
        <button class="icon-btn" id="rtlToggle" aria-label="Toggle text direction">
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
            <i class="fa-regular fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <a href="index.html" class="brand">
        <img decoding="async" src="images/logo.webp" alt="Wing & Bloom logo" class="brand-logo">
        <div class="brand-text">
            <span class="brand-name">Wing <em>&amp;</em> Bloom</span>
            <span class="brand-tagline">Where Nature Takes Flight</span>
        </div>
    </a>
</header>

<main class="error-page">
    <img fetchpriority="high" decoding="async" src="images/monarch-butterfly.webp" alt="A monarch butterfly" class="error-illustration">

    <span class="error-code">404</span>
    <h1>Looks Like This Butterfly Flew Away</h1>
    <p>The page you're looking for doesn't exist, has been moved, or never took flight. Let's get you back on the right path.</p>

    <div class="error-actions">
        <a href="index.html" class="btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
        <a href="contact.html" class="btn-outline">Contact Us</a>
    </div>
</main>

<script src="site-shared.js"></script>
</body>
</html>
